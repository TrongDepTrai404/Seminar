<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đăng nhập – DKHP</title>
  <!-- Trang mẫu tối giản để chạy E2E test. Thay bằng trang đăng nhập thật của nhóm,
       nhớ giữ nguyên các id: mssv, matKhau, btnDangNhap, loi -->
</head>
<body>
  <h1>Đăng nhập</h1>
  <form id="formDangNhap">
    <input id="mssv" placeholder="MSSV">
    <input id="matKhau" type="password" placeholder="Mật khẩu">
    <button id="btnDangNhap" type="submit">Đăng nhập</button>
  </form>
  <p id="loi" style="color:red"></p>

  <script>
    document.getElementById('formDangNhap').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          mssv: document.getElementById('mssv').value,
          matKhau: document.getElementById('matKhau').value,
        }),
      });
      const data = await res.json();
      if (res.ok) {
        localStorage.setItem('mssv', data.mssv);
        window.location.href = 'trang-chu.html';
      } else {
        document.getElementById('loi').textContent = data.message;
      }
    });
  </script>
</body>
</html>
